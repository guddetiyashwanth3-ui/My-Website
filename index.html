<html>
<head>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #292323, #655151);
            padding:20px;
            min-height: 60vh;
            position: relative;
            overflow-x: hidden;
        }
        .grid {display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px}
        .card { cursor: pointer;
                text-align: center;
                background: #1F150C;
                padding: 15px;
                border-radius: 12px;
                box-shadow:0 8px 20px rgba(0,0,0,0.25);
                transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                will-change: transform, box-shadow;
                z-index: 1
            }
        .card::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 15px;
            background: linear-gradient(135deg, #412D15, #E1DCC9);
            z-index: -1;
            opacity: 0;
            filter: blur(40px);
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                        filter 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover {
                transform: translateY(-8px);
                box-shadow:  0 18px 32px rgba(0,0,0,0.32);
            }
        .card:hover::before  {
            opacity: 0.85;
            filter: blur(4px);
         }
        .card img { width: 100%;
                    height: 180px;
                    object-fit: cover;
                    border-radius: 15px;
                    display: block;
                    margin: 0 auto;
                    transition: transform 0.3s ease;
                     }
        .card img:hover{
            transform: scale(1.05);
        }
        a{
            text-decoration:none;
            color:#FFFFFF;
            font-weight: bold;
        }
        .spotify-link {
            color: #79827e;
        }
        .yt-link {
            color: #807070;
        }
        .card h3 {
            margin: 10px 0 5px;
            font-size: 1.2em;
            color: #E1DCC9;
        } 
        .card p {
            margin: 0;
            font-size: 1em;
            color: #E1DCC9;
            font- weight: bold;
        } 
    </style>
